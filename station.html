<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#303841" />
    <meta name="robots" content="noindex" />
    <title>Station screen</title>
    <!--
      One kitchen station's screen, opened at /station/hot, /station/cold or /station/bar on a tablet at
      that station. Static: everything it shows comes through the hub's authenticated routes, so the
      page itself carries nothing. Follows the same light/dark choice as the other staff screens.
    -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('kullina_theme') || 'system';
          var d = document.documentElement;
          if (t === 'system') {
            var m = window.matchMedia('(prefers-color-scheme: dark)').matches;
            d.classList.add(m ? 'dark' : 'light');
          } else {
            d.setAttribute('data-theme', t);
            d.classList.add(t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/station_main.jsx"></script>
  </body>
</html>
