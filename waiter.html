<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ff5722" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Waiter App" />
    <link rel="manifest" href="/manifest.json" />
    <title>Waiter Handset — Mejwani POS</title>
    <style>
      body { background: var(--color-surface-soft); }
      @media (min-width: 481px) {
        body { background: var(--color-surface-strong); }
        #root > div { border-left: 1px solid var(--color-hairline); border-right: 1px solid var(--color-hairline); min-height: 100vh; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/waiter_main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ Waiter PWA Service Worker Registered:', reg.scope))
            .catch(err => console.warn('⚠️ Service Worker Registration Failed:', err));
        });
      }
    </script>
  </body>
</html>
