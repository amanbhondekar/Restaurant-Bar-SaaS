<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/waiter-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ff5722" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Waiter POS" />
    <link rel="manifest" href="/manifest.json" />
    <title>Waiter Handset — Mejwani POS</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('kullina_theme') || 'system';
          var d = document.documentElement;
          if (t === 'system') {
            var m = window.matchMedia('(prefers-color-scheme: dark)').matches;
            d.classList.add(m ? 'dark' : 'light');
          } else {
            d.setAttribute('data-theme', t);
            d.classList.add(t);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      body { background: var(--color-surface-soft); }
      @media (min-width: 481px) {
        body { background: var(--color-surface-strong); }
        #root > div { border-left: 1px solid var(--color-hairline); border-right: 1px solid var(--color-hairline); min-height: 100vh; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/waiter_main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // In local Vite dev mode (port 3000), unregister any active service worker
        // to prevent dev chunk caching conflicts and force direct network loading.
        if (window.location.port === '3000') {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (let reg of regs) {
              reg.unregister();
              console.log('🧹 Cleaned dev Service Worker registration');
            }
          });
          if ('caches' in window) {
            caches.keys().then(names => {
              for (let name of names) {
                caches.delete(name);
              }
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('✅ Waiter PWA Service Worker Registered:', reg.scope))
              .catch(err => console.warn('⚠️ Service Worker Registration Failed:', err));
          });
        }
      }
    </script>
  </body>
</html>
