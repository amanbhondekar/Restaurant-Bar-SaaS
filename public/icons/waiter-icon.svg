<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b3d"/>
      <stop offset="100%" stop-color="#c44d18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Rim Light -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Central Service Cloche & Fork / Knife Dining Glyph -->
  <g filter="url(#shadow)" transform="translate(40, 20)">
    <!-- Cloche Handle -->
    <circle cx="216" cy="140" r="22" fill="#ffffff"/>
    <rect x="208" y="156" width="16" height="18" rx="4" fill="#ffffff"/>

    <!-- Cloche Dome -->
    <path d="M 96 280 C 96 190, 160 170, 216 170 C 272 170, 336 190, 336 280 Z" fill="#ffffff"/>

    <!-- Cloche Base Rim -->
    <rect x="76" y="282" width="280" height="24" rx="12" fill="#ffffff"/>

    <!-- Plate Base -->
    <ellipse cx="216" cy="324" rx="160" ry="16" fill="rgba(255, 255, 255, 0.9)"/>

    <!-- Cutlery / Serving Motif in Dome Accent -->
    <path d="M 176 244 L 256 244" stroke="#c44d18" stroke-width="6" stroke-linecap="round"/>
    <circle cx="216" cy="226" r="8" fill="#c44d18"/>
  </g>

  <!-- Waiter Badge Indicator -->
  <rect x="180" y="380" width="152" height="42" rx="21" fill="#ffffff" filter="url(#shadow)"/>
  <text x="256" y="408" fill="#c44d18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="3">WAITER</text>
</svg>
