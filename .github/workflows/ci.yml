name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Cancel superseded runs on the same ref so a fast retry doesn't pile up.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable long paths on Windows runners
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Hub regression suite
        run: npm test
        env:
          # Deterministic order and time-based tests don't need a real timezone.
          TZ: UTC

      - name: Production build (KDS + waiter PWA)
        run: npm run build

      - name: Upload built dist as artifact
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
